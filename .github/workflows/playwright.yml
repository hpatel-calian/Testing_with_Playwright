name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      # Only Chromium runs (Firefox/WebKit projects are disabled in playwright.config.ts).
      run: npx playwright install --with-deps chromium
    # Lint (playwright-best-practices rules), type check, and fail if any test lacks a Jira tag.
    - name: Lint, type check and Jira tag check
      run: npm run verify
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Set under Settings → Secrets and variables → Actions → Variables.
        TEST_ENV: ${{ vars.TEST_ENV }}
    # Playwright HTML report (steps, screenshots, traces) for this run.
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ github.run_number }}
        path: playwright-report/
        retention-days: 30
