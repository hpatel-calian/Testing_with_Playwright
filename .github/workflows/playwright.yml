name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Set these under Settings → Secrets and variables → Actions → Variables.
        JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
        TEST_ENV: ${{ vars.TEST_ENV }}
    # One bundle = audit evidence for this run: traceability matrix + full report (screenshots, traces).
    # Keep the two folders together; the matrix links into the Playwright report.
    # GitHub keeps artifacts for 90 days at most — archive release runs somewhere permanent.
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-evidence-${{ github.run_number }}-${{ github.sha }}
        path: |
          traceability-report/
          playwright-report/
        retention-days: 90
